# Google Cloud Build -> Cloud Run continuous deployment
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/nihao-learning:$COMMIT_SHA', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/nihao-learning:$COMMIT_SHA']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'nihao-learning'
      - '--image=gcr.io/$PROJECT_ID/nihao-learning:$COMMIT_SHA'
      - '--region=asia-southeast1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--min-instances=0'
      - '--max-instances=5'
      - '--set-env-vars=GOOGLE_GENAI_USE_VERTEXAI=true,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=us-central1,GCS_CACHE_BUCKET=$PROJECT_ID-nihao-cache'
  - name: 'node:22-alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - 'npm run build && npx -y firebase-tools deploy --only hosting --project $PROJECT_ID'
images:
  - 'gcr.io/$PROJECT_ID/nihao-learning:$COMMIT_SHA'
